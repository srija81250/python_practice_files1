{% extends 'base.html' %}

{% block content %}

<h2>All Students</h2>

<table>

<tr>
    <th>Roll</th>
    <th>Name</th>
    <th>Age</th>
    <th>Course</th>
</tr>

{% for student in students %}

<tr>
    <td>{{ student.roll }}</td>
    <td>{{ student.name }}</td>
    <td>{{ student.age }}</td>
    <td>{{ student.course }}</td>
</tr>

{% endfor %}

</table>

{% endblock %}
